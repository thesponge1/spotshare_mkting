<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpotShare City Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #6366f1;
      --bg: #0d0e14;
      --bg-card: #13151f;
      --bg-card-hover: #181a27;
      --bg-row: #0f111a;
      --bg-row-alt: #111320;
      --border: rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.14);
      --text: #e2e4f0;
      --text-muted: #6b7280;
      --text-dim: #9ca3af;
      --green: #22c55e;
      --green-bg: rgba(34,197,94,0.12);
      --green-text: #4ade80;
      --yellow: #eab308;
      --yellow-bg: rgba(234,179,8,0.12);
      --yellow-text: #fbbf24;
      --blue: #3b82f6;
      --blue-bg: rgba(59,130,246,0.12);
      --blue-text: #60a5fa;
      --red: #ef4444;
      --red-bg: rgba(239,68,68,0.12);
      --red-text: #f87171;
      --orange: #f97316;
      --orange-bg: rgba(249,115,22,0.12);
      --gray: #6b7280;
      --gray-bg: rgba(107,114,128,0.12);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 50;
      height: 56px;
    }
    .logo-mark {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #fff;
      flex-shrink: 0; margin-right: 10px;
    }
    .header-title { font-size: 15px; font-weight: 600; color: var(--text); margin-right: 32px; }
    .header-tabs { display: flex; height: 100%; align-items: flex-end; gap: 0; }
    .header-tab {
      padding: 0 18px;
      height: 56px;
      display: flex; align-items: center;
      font-size: 13px; font-weight: 500;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      user-select: none;
    }
    .header-tab:hover { color: var(--text); }
    .header-tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .header-right { margin-left: auto; font-size: 12px; color: var(--text-muted); }

    /* ── Tab panes ── */
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ── Main ── */
    main { max-width: 1300px; margin: 0 auto; padding: 28px 24px 72px; }

    /* ── Section label ── */
    .section-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
    }

    /* ── Metric cards ── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px; margin-bottom: 28px;
    }
    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 18px 20px;
      position: relative; overflow: hidden;
    }
    .metric-card::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: var(--accent); opacity: .5;
    }
    .metric-label { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }
    .metric-value { font-size: 32px; font-weight: 700; color: var(--text); line-height: 1; margin-bottom: 2px; }
    .metric-sub { font-size: 11px; color: var(--text-muted); }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600;
      padding: 3px 10px; border-radius: 20px; white-space: nowrap;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .b-gray    { background: var(--gray-bg);   color: var(--gray);       } .b-gray   .badge-dot { background: var(--gray); }
    .b-blue    { background: var(--blue-bg);   color: var(--blue-text);  } .b-blue   .badge-dot { background: var(--blue); }
    .b-green   { background: var(--green-bg);  color: var(--green-text); } .b-green  .badge-dot { background: var(--green); }
    .b-yellow  { background: var(--yellow-bg); color: var(--yellow-text);} .b-yellow .badge-dot { background: var(--yellow); }
    .b-red     { background: var(--red-bg);    color: var(--red-text);   } .b-red    .badge-dot { background: var(--red); }
    .b-orange  { background: var(--orange-bg); color: var(--orange);     } .b-orange .badge-dot { background: var(--orange); }

    /* ── Alerts section ── */
    .alerts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px; margin-bottom: 28px;
    }
    .alert-card {
      background: var(--bg-card);
      border: 1px solid rgba(99,102,241,.3);
      border-radius: 10px; padding: 14px 16px;
      cursor: pointer; transition: border-color .15s, background .15s;
      position: relative; overflow: hidden;
    }
    .alert-card::before {
      content: ''; position: absolute;
      top: 0; left: 0; width: 3px; height: 100%;
      background: var(--accent);
    }
    .alert-card:hover { background: var(--bg-card-hover); border-color: rgba(99,102,241,.6); }
    .alert-city { font-size: 13px; font-weight: 600; color: var(--text); padding-left: 4px; margin-bottom: 3px; }
    .alert-type { font-size: 11px; color: var(--text-muted); padding-left: 4px; margin-bottom: 8px; }
    .alert-text {
      font-size: 12px; color: #a5b4fc;
      background: rgba(99,102,241,.1);
      border-radius: 6px; padding: 8px 10px; line-height: 1.45;
    }

    /* ── Kanban ── */
    .kanban {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      margin-bottom: 8px;
    }
    .k-col { padding: 14px; border-right: 1px solid var(--border); background: var(--bg-card); }
    .k-col:last-child { border-right: none; }
    .k-col-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .k-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .k-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; flex: 1; }
    .k-count {
      font-size: 11px; font-weight: 600;
      background: var(--gray-bg); color: var(--text-muted);
      border-radius: 10px; padding: 1px 8px;
    }
    .k-card {
      background: var(--bg-row);
      border: 1px solid var(--border);
      border-radius: 7px; padding: 9px 12px;
      margin-bottom: 7px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      transition: background .1s, border-color .15s;
    }
    .k-card:last-child { margin-bottom: 0; }
    .k-card:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
    .k-card-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .k-card-meta { display: flex; align-items: center; gap: 5px; }
    .stale-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); flex-shrink: 0; }

    /* ── Table ── */
    .table-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .table-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .table-header h2 { font-size: 14px; font-weight: 600; }
    .table-hint { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .table-wrap-inner { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      text-align: left; padding: 11px 16px;
      font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-muted); background: rgba(255,255,255,.02);
      border-bottom: 1px solid var(--border); white-space: nowrap;
      cursor: pointer; user-select: none; transition: color .15s;
    }
    thead th:hover { color: var(--text); }
    tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:nth-child(odd)  { background: var(--bg-row); }
    tbody tr:nth-child(even) { background: var(--bg-row-alt); }
    tbody tr:hover { background: var(--bg-card-hover); }
    td { padding: 11px 16px; vertical-align: middle; white-space: nowrap; }
    td.city-cell { font-weight: 500; white-space: normal; min-width: 130px; }
    td.angle-cell { max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); font-size: 12px; }
    td.angle-cell.has { color: #a5b4fc; }
    td.targets-cell { max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); font-size: 12px; }

    /* ── Signal colors ── */
    .sig-red    { color: var(--red-text); }
    .sig-yellow { color: var(--yellow-text); }
    .sig-green  { color: var(--green-text); }
    .sig-gray   { color: var(--text-muted); font-style: italic; }

    /* ── Detail panel ── */
    #panel-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
      z-index: 100; opacity: 0; transition: opacity .2s ease;
    }
    #panel-backdrop.visible { opacity: 1; }
    #detail-panel {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 620px; max-width: 100vw;
      background: #0f1119;
      border-left: 1px solid var(--border);
      z-index: 101; display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .25s cubic-bezier(.4,0,.2,1);
      overflow: hidden;
    }
    #detail-panel.open { transform: translateX(0); }
    .panel-header {
      padding: 22px 26px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .panel-header-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 14px; margin-bottom: 12px;
    }
    .panel-city-name { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.2; }
    .panel-close {
      background: var(--gray-bg); border: none; color: var(--text-muted);
      width: 30px; height: 30px; border-radius: 7px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; transition: background .15s, color .15s;
    }
    .panel-close:hover { background: var(--border-strong); color: var(--text); }
    .panel-badges { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .btn-seo {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600;
      padding: 4px 13px; border-radius: 20px;
      text-decoration: none; border: none; cursor: pointer;
      transition: opacity .15s;
    }
    .btn-seo.active { background: var(--accent); color: #fff; }
    .btn-seo.active:hover { opacity: .85; }
    .btn-seo.disabled { background: var(--gray-bg); color: var(--text-muted); cursor: not-allowed; }
    .panel-body {
      flex: 1; overflow-y: auto;
      padding: 22px 26px 48px;
      display: flex; flex-direction: column; gap: 26px;
    }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 10px; }

    /* ── Panel sections ── */
    .ps { display: flex; flex-direction: column; gap: 10px; }
    .ps-label {
      font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--text-muted); padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }

    /* Market moments */
    .moment-card {
      background: linear-gradient(135deg, rgba(99,102,241,.12) 0%, rgba(99,102,241,.06) 100%);
      border: 1px solid rgba(99,102,241,.3);
      border-radius: 9px; padding: 14px 16px; margin-bottom: 7px;
    }
    .moment-card:last-child { margin-bottom: 0; }
    .moment-text { font-size: 13px; font-weight: 500; color: #c7d2fe; line-height: 1.55; }
    .moment-tag { font-size: 10px; color: rgba(165,180,252,.6); margin-top: 5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }

    /* Outreach angle */
    .outreach-box {
      background: rgba(59,130,246,.08);
      border: 1px solid rgba(59,130,246,.25);
      border-left: 3px solid var(--blue);
      border-radius: 0 9px 9px 0;
      padding: 14px 16px;
      font-size: 13px; color: #93c5fd; line-height: 1.6;
    }
    .outreach-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); margin-bottom: 6px; }

    /* Signal grid */
    .signal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .signal-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 13px;
    }
    .signal-name { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .signal-val { font-size: 12px; font-weight: 600; }
    .signal-note { font-size: 11px; color: var(--text-dim); line-height: 1.4; margin-top: 3px; }

    /* Competitors */
    .comp-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 9px; padding: 12px 14px; margin-bottom: 8px;
    }
    .comp-item:last-child { margin-bottom: 0; }
    .comp-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .comp-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .comp-tier { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
    .t1  { background: var(--red-bg); color: var(--red-text); }
    .t2  { background: var(--yellow-bg); color: var(--yellow-text); }
    .tw  { background: var(--gray-bg); color: var(--gray); }
    .comp-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-bottom: 8px; }
    .comp-angles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .comp-angle {
      border-radius: 7px; padding: 8px 10px;
      font-size: 11px; line-height: 1.45;
    }
    .comp-angle-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
    .their { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); }
    .their .comp-angle-label { color: var(--red-text); }
    .their .comp-angle-text  { color: #fca5a5; }
    .ours { background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.2); }
    .ours .comp-angle-label { color: var(--green-text); }
    .ours .comp-angle-text  { color: #86efac; }

    /* Development pipeline */
    .dev-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 13px; margin-bottom: 7px;
      font-size: 12px; color: var(--text-dim); line-height: 1.55;
    }
    .dev-item:last-child { margin-bottom: 0; }

    /* Search intelligence */
    .kw-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .kw-pill { font-size: 11px; font-weight: 500; background: var(--blue-bg); color: var(--blue-text); padding: 3px 10px; border-radius: 20px; }
    .gap-box {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 13px;
      font-size: 13px; color: var(--text-dim); font-style: italic; line-height: 1.5;
    }

    /* Confidence */
    .conf-box {
      border-radius: 0 8px 8px 0;
      padding: 10px 13px;
      font-size: 12px; line-height: 1.5;
    }
    .conf-high   { background: rgba(34,197,94,.07);  border-left: 3px solid var(--green);  color: var(--green-text); }
    .conf-medium { background: rgba(234,179,8,.07);  border-left: 3px solid var(--yellow); color: var(--yellow-text); }
    .conf-low    { background: rgba(239,68,68,.07);  border-left: 3px solid var(--red);    color: var(--red-text); }

    /* Research Intel tabs */
    .intel-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .intel-tab {
      padding: 4px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border);
      background: transparent; color: var(--text-dim);
      transition: background .15s, border-color .15s, color .15s;
    }
    .intel-tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }
    .intel-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tab-count {
      display: inline-block; background: rgba(255,255,255,.22);
      border-radius: 10px; padding: 0 6px; font-size: 10px; margin-left: 4px;
    }
    .intel-tab:not(.active) .tab-count { background: var(--border); color: var(--text-muted); }
    .intel-pane { display: block; }
    .intel-pane[hidden] { display: none; }
    .intel-find {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 13px; margin-bottom: 7px;
    }
    .intel-find:last-child { margin-bottom: 0; }
    .intel-src { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .intel-txt { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
    .intel-opp { font-size: 11px; color: #a5b4fc; font-style: italic; margin-top: 5px; line-height: 1.4; }
    .intel-link { display: inline-block; font-size: 11px; color: var(--accent); margin-top: 4px; text-decoration: none; word-break: break-all; }
    .intel-link:hover { text-decoration: underline; }
    .intel-empty { color: var(--text-muted); font-style: italic; font-size: 12px; padding: 6px 0; }
    .intel-loading { color: var(--text-muted); font-size: 12px; padding: 6px 0; }

    /* History */
    .history-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--text-dim); padding: 2px 0;
    }
    .no-data { font-size: 12px; color: var(--text-muted); font-style: italic; }

    /* Footer */
    footer { text-align: center; padding: 28px 24px 20px; font-size: 12px; color: var(--text-muted); }
    footer span { color: var(--text-dim); }

    @media (max-width: 700px) {
      .kanban { grid-template-columns: 1fr; }
      .signal-grid { grid-template-columns: 1fr; }
      .comp-angles { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">S</div>
  <span class="header-title">SpotShare</span>
  <div class="header-tabs">
    <div class="header-tab active" data-tab="seo">SEO pipeline</div>
    <div class="header-tab" data-tab="sales">Sales intelligence</div>
  </div>
  <div class="header-right" id="header-right"></div>
</header>

<main>

  <!-- ── SEO PIPELINE TAB ── -->
  <div class="tab-pane active" id="tab-seo">
    <div class="section-label">Pipeline summary</div>
    <div class="metrics-grid" id="seo-metrics"></div>

    <div class="section-label">Active market moments</div>
    <div class="alerts-grid" id="alerts-grid"></div>

    <div class="section-label" style="margin-bottom:14px">City pipeline</div>
    <div class="kanban" id="kanban"></div>
  </div>

  <!-- ── SALES INTELLIGENCE TAB ── -->
  <div class="tab-pane" id="tab-sales">
    <div class="section-label">Sales summary</div>
    <div class="metrics-grid" id="sales-metrics"></div>

    <div class="section-label" style="margin-bottom:14px">All markets</div>
    <div class="table-section">
      <div class="table-header">
        <h2>Market briefings</h2>
        <span id="sales-city-count" class="badge b-gray" style="font-size:11px"></span>
        <span class="table-hint">Click any row to open full briefing</span>
      </div>
      <div class="table-wrap-inner">
        <table>
          <thead>
            <tr>
              <th>City</th>
              <th>Readiness</th>
              <th>Competitors</th>
              <th>Availability pressure</th>
              <th>Named prospects</th>
              <th>Outreach angle</th>
              <th>Research confidence</th>
            </tr>
          </thead>
          <tbody id="sales-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<footer id="footer"></footer>

<!-- ── Detail panel ── -->
<div id="panel-backdrop"></div>
<div id="detail-panel" role="dialog" aria-modal="true" aria-label="City detail">
  <div class="panel-header">
    <div class="panel-header-top">
      <div class="panel-city-name" id="panel-city-name"></div>
      <button class="panel-close" id="panel-close" aria-label="Close">✕</button>
    </div>
    <div class="panel-badges" id="panel-badges"></div>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

<script>
fetch('city-index.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(DATA => { init(DATA); })
  .catch(err => {
    document.querySelector('main').innerHTML =
      `<div style="padding:40px;color:#6b7280;text-align:center">
        ⚠ Could not load city-index.json — make sure the file is in the same folder as this dashboard.<br>
        <small style="color:#4b5563">${err.message}</small>
      </div>`;
  });

function init(DATA) {
  const cities = DATA.cities;
  const today  = Date.now();

  /* ── Helpers ── */
  function fmt(d) {
    if (!d) return '—';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function isStale(c) {
    const dates = [c.research.last_run_date, c.seo.last_built_date].filter(Boolean);
    if (!dates.length) return false;
    const latest = dates.sort().pop();
    return (today - new Date(latest + 'T00:00:00').getTime()) > 30 * 24 * 60 * 60 * 1000;
  }
  function signalParts(val) {
    if (!val) return { cls: 'sig-gray', badge: '—', note: null };
    const i = val.indexOf(' — ');
    const badge = i !== -1 ? val.slice(0, i) : val;
    const note  = i !== -1 ? val.slice(i + 3) : null;
    const v = badge.toLowerCase();
    let cls = 'sig-gray';
    if (/critical|high|active|worsening|severe/.test(v)) cls = 'sig-red';
    else if (/moderate|medium|light|stable/.test(v))     cls = 'sig-yellow';
    else if (/low|none|improving|minimal/.test(v))       cls = 'sig-green';
    return { cls, badge, note };
  }
  function statusBadge(s) {
    const map = {
      'not-started': ['b-gray',   'Not started'],
      'researched':  ['b-blue',   'Researched'],
      'page-live':   ['b-green',  'Page live'],
    };
    const [cls, lbl] = map[s] || ['b-gray', s || '—'];
    return `<span class="badge ${cls}"><span class="badge-dot"></span>${lbl}</span>`;
  }
  function readinessBadge(r) {
    if (!r) return `<span class="badge b-gray">—</span>`;
    const map = { 'tier-1': 'b-green', 'tier-2': 'b-yellow', 'tier-3': 'b-gray' };
    return `<span class="badge ${map[r] || 'b-gray'}">${r}</span>`;
  }
  function compBadge(p) {
    if (!p) return `<span class="badge b-gray">—</span>`;
    const v = p.toLowerCase();
    if (/active/.test(v))  return `<span class="badge b-red">Active</span>`;
    if (/light/.test(v))   return `<span class="badge b-yellow">Light</span>`;
    if (/absent|zero|none/.test(v)) return `<span class="badge b-green">Absent</span>`;
    return `<span class="badge b-gray">${p.slice(0,20)}</span>`;
  }
  function confBadge(c) {
    if (!c) return `<span class="badge b-gray">—</span>`;
    const v = c.toLowerCase();
    if (/^high/.test(v))   return `<span class="badge b-green">High</span>`;
    if (/^medium/.test(v)) return `<span class="badge b-yellow">Medium</span>`;
    if (/^low/.test(v))    return `<span class="badge b-red">Low</span>`;
    return `<span class="badge b-gray">${c.slice(0,10)}</span>`;
  }
  function noData(t) { return `<span class="no-data">${t || 'No data yet'}</span>`; }

  /* ── Tab switching ── */
  document.querySelectorAll('.header-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.header-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });

  /* ═══════════════════════════════
     SEO PIPELINE TAB
  ═══════════════════════════════ */
  const total    = cities.length;
  const pageLive = cities.filter(c => c.status === 'page-live').length;
  const researched = cities.filter(c => c.status === 'researched').length;
  const notStarted = cities.filter(c => (c.status || 'not-started') === 'not-started').length;

  const seoMetrics = [
    { label: 'Cities tracked',  value: total,       sub: 'in pipeline' },
    { label: 'Pages live',      value: pageLive,    sub: 'published & indexed' },
    { label: 'Researched',      value: researched,  sub: 'ready to build' },
    { label: 'Not started',     value: notStarted,  sub: 'in queue' },
  ];
  const seoMetricsEl = document.getElementById('seo-metrics');
  seoMetrics.forEach(m => {
    seoMetricsEl.innerHTML += `
      <div class="metric-card">
        <div class="metric-label">${m.label}</div>
        <div class="metric-value">${m.value}</div>
        <div class="metric-sub">${m.sub}</div>
      </div>`;
  });

  /* Alerts — cities with market_moments */
  const alertsEl = document.getElementById('alerts-grid');
  const citiesWithMoments = cities.filter(c =>
    c.research.market_moments && c.research.market_moments.length > 0
  );
  if (citiesWithMoments.length === 0) {
    alertsEl.innerHTML = `<div class="no-data" style="padding:8px 0">No active market moments — run city research to populate.</div>`;
  } else {
    citiesWithMoments.forEach(c => {
      const moments = c.research.market_moments;
      const primary = moments[0];
      const card = document.createElement('div');
      card.className = 'alert-card';
      card.innerHTML = `
        <div class="alert-city">${c.city}</div>
        <div class="alert-type">${moments.length} market moment${moments.length > 1 ? 's' : ''} · ${fmt(c.research.last_run_date)}</div>
        <div class="alert-text">${primary}</div>`;
      card.addEventListener('click', () => openPanel(c));
      alertsEl.appendChild(card);
    });
  }

  /* Kanban */
  const kanbanEl = document.getElementById('kanban');
  const COLS = [
    { status: 'not-started', label: 'Not started', color: '#6b7280' },
    { status: 'researched',  label: 'Researched',  color: '#3b82f6' },
    { status: 'page-live',   label: 'Page live',   color: '#22c55e' },
  ];
  COLS.forEach(col => {
    const colCities = cities.filter(c => (c.status || 'not-started') === col.status);
    const div = document.createElement('div');
    div.className = 'k-col';
    div.innerHTML = `
      <div class="k-col-head">
        <span class="k-dot" style="background:${col.color}"></span>
        <span class="k-title" style="color:${col.color}">${col.label}</span>
        <span class="k-count">${colCities.length}</span>
      </div>
      <div class="k-cards"></div>`;
    const cardsEl = div.querySelector('.k-cards');
    colCities.forEach(c => {
      const card = document.createElement('div');
      card.className = 'k-card';
      const tier = c.research.market_readiness;
      const tierPill = tier
        ? `<span class="badge ${tier === 'tier-1' ? 'b-green' : tier === 'tier-2' ? 'b-yellow' : 'b-gray'}" style="font-size:10px;padding:1px 7px">${tier}</span>`
        : '';
      card.innerHTML = `
        <span class="k-card-name">${c.city}</span>
        <span class="k-card-meta">
          ${tierPill}
          ${isStale(c) ? '<span class="stale-dot" title="Not updated in 30+ days"></span>' : ''}
        </span>`;
      card.addEventListener('click', () => openPanel(c));
      cardsEl.appendChild(card);
    });
    kanbanEl.appendChild(div);
  });

  /* ═══════════════════════════════
     SALES INTELLIGENCE TAB
  ═══════════════════════════════ */
  const tier1Cities = cities.filter(c => c.research.market_readiness === 'tier-1');
  const activeComp  = cities.filter(c => c.research.competitor_presence && /active/.test(c.research.competitor_presence.toLowerCase()));
  const noCompCities = cities.filter(c => c.research.competitor_presence && /absent|zero|none/.test(c.research.competitor_presence.toLowerCase()));
  const namedProspects = cities.filter(c => c.research.new_development_pipeline === 'yes' || (c.research.new_development_pipeline && c.research.new_development_pipeline !== 'no'));

  const salesMetrics = [
    { label: 'Tier-1 markets',    value: tier1Cities.length,   sub: 'act on these first' },
    { label: 'Active competitors', value: activeComp.length,   sub: 'markets with named competition' },
    { label: 'Open territory',    value: noCompCities.length,  sub: 'no named competitor presence' },
    { label: 'Named prospects',   value: namedProspects.length, sub: 'cities with pipeline buildings' },
  ];
  const salesMetricsEl = document.getElementById('sales-metrics');
  salesMetrics.forEach(m => {
    salesMetricsEl.innerHTML += `
      <div class="metric-card">
        <div class="metric-label">${m.label}</div>
        <div class="metric-value">${m.value}</div>
        <div class="metric-sub">${m.sub}</div>
      </div>`;
  });

  document.getElementById('sales-city-count').textContent = `${cities.length} cities`;

  const salesTbody = document.getElementById('sales-tbody');
  cities.forEach(c => {
    const r = c.research;
    const avail = signalParts(r.availability_signal);
    const angle = r.outreach_angle || null;
    const pipeline = r.new_development_pipeline;
    const pipelineText = (pipeline && pipeline !== 'no' && pipeline !== 'unknown')
      ? pipeline.replace(/^yes\s*—\s*/i, '').slice(0, 60) + (pipeline.length > 60 ? '…' : '')
      : null;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="city-cell">${c.city}</td>
      <td>${readinessBadge(r.market_readiness)}</td>
      <td>${compBadge(r.competitor_presence)}</td>
      <td><span class="${avail.cls}" style="font-size:12px;font-weight:600">${avail.badge}</span></td>
      <td class="targets-cell ${pipelineText ? 'has' : ''}" title="${pipeline || ''}">${pipelineText || '<span class="no-data">—</span>'}</td>
      <td class="angle-cell ${angle ? 'has' : ''}" title="${angle || ''}">${angle ? angle.slice(0, 60) + (angle.length > 60 ? '…' : '') : '<span class="no-data">—</span>'}</td>
      <td>${confBadge(r.run_confidence)}</td>`;
    tr.addEventListener('click', () => openPanel(c));
    salesTbody.appendChild(tr);
  });

  /* ── Footer ── */
  const allDates = cities.map(c => c.research.last_run_date).filter(Boolean).sort();
  const mostRecent = allDates.length ? allDates[allDates.length - 1] : DATA.rotation.last_run_date;
  document.getElementById('footer').innerHTML =
    `Last research run: <span>${fmt(mostRecent)}</span> &nbsp;·&nbsp; Data source: city-index.json`;
  document.getElementById('header-right').textContent = `Last run: ${fmt(mostRecent)}`;

  /* ═══════════════════════════════
     DETAIL PANEL
  ═══════════════════════════════ */
  const backdrop = document.getElementById('panel-backdrop');
  const panel    = document.getElementById('detail-panel');

  function openPanel(city) {
    buildPanel(city);
    backdrop.style.display = 'block';
    backdrop.offsetHeight;
    backdrop.classList.add('visible');
    panel.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('panel-close').focus();
  }
  function closePanel() {
    backdrop.classList.remove('visible');
    panel.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(() => { backdrop.style.display = 'none'; }, 220);
  }
  backdrop.addEventListener('click', closePanel);
  document.getElementById('panel-close').addEventListener('click', closePanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

  function buildPanel(c) {
    const r = c.research;
    const s = c.seo;

    document.getElementById('panel-city-name').textContent = c.city;

    const seoBtn = s.page_built
      ? `<a class="btn-seo active" href="${s.page_path}" target="_blank">↗ View SEO page</a>`
      : `<button class="btn-seo disabled" disabled>No page yet</button>`;

    document.getElementById('panel-badges').innerHTML =
      statusBadge(c.status) +
      readinessBadge(r.market_readiness) +
      compBadge(r.competitor_presence) +
      seoBtn;

    const body = document.getElementById('panel-body');
    let html = '';

    /* 1. Outreach angle */
    if (r.outreach_angle) {
      html += `
        <div class="ps">
          <div class="ps-label">Outreach angle — use this now</div>
          <div class="outreach-box">
            <div class="outreach-label">Lead with this</div>
            ${r.outreach_angle}
          </div>
        </div>`;
    }

    /* 2. Market moments */
    const moments = r.market_moments && r.market_moments.length
      ? r.market_moments
      : (r.market_moment ? [r.market_moment] : []);
    if (moments.length) {
      const cards = moments.map((m, i) => `
        <div class="moment-card">
          <div class="moment-text">${m}</div>
          <div class="moment-tag">Moment ${i + 1} of ${moments.length}</div>
        </div>`).join('');
      html += `
        <div class="ps">
          <div class="ps-label">Market moments (${moments.length})</div>
          ${cards}
        </div>`;
    }

    /* 3. Competitors */
    if (r.competitors && r.competitors.length) {
      const compHtml = r.competitors.map(comp => {
        const tierCls = comp.tier === '1' ? 't1' : comp.tier === '2' ? 't2' : 'tw';
        const tierLbl = comp.tier === '1' ? 'Tier 1' : comp.tier === '2' ? 'Tier 2' : 'Watch';
        const angles = (comp.their_angle || comp.spotshare_counter)
          ? `<div class="comp-angles">
              ${comp.their_angle ? `<div class="comp-angle their"><div class="comp-angle-label">Their angle</div><div class="comp-angle-text">${comp.their_angle}</div></div>` : ''}
              ${comp.spotshare_counter ? `<div class="comp-angle ours"><div class="comp-angle-label">SpotShare counter</div><div class="comp-angle-text">${comp.spotshare_counter}</div></div>` : ''}
            </div>` : '';
        return `
          <div class="comp-item">
            <div class="comp-header">
              <span class="comp-name">${comp.name}</span>
              <span class="comp-tier ${tierCls}">${tierLbl}</span>
            </div>
            <div class="comp-desc">${comp.description}</div>
            ${angles}
          </div>`;
      }).join('');
      html += `
        <div class="ps">
          <div class="ps-label">Competitor intelligence (${r.competitors.length})</div>
          ${compHtml}
        </div>`;
    }

    /* 4. Market signals */
    const signals = [
      { name: 'Parking cost',       key: 'parking_cost_signal' },
      { name: 'Availability',       key: 'availability_signal' },
      { name: 'Regulatory trend',   key: 'regulatory_trend' },
      { name: 'HOA friction',       key: 'hoa_friction_level' },
      { name: 'Visitor parking ratio', key: 'visitor_parking_ratio' },
      { name: 'New development',    key: 'new_development_pipeline' },
    ];
    let sigHtml = '<div class="signal-grid">';
    signals.forEach(sig => {
      const { cls, badge, note } = signalParts(r[sig.key]);
      sigHtml += `
        <div class="signal-item">
          <div class="signal-name">${sig.name}</div>
          <div class="signal-val ${cls}">${badge || '—'}</div>
          ${note ? `<div class="signal-note">${note}</div>` : ''}
        </div>`;
    });
    sigHtml += '</div>';
    html += `<div class="ps"><div class="ps-label">Market signals</div>${sigHtml}</div>`;

    /* 5. Development pipeline */
    if (r.new_development_pipeline && r.new_development_pipeline !== 'no' && r.new_development_pipeline !== 'unknown') {
      const devText = r.new_development_pipeline.replace(/^yes\s*—\s*/i, '');
      html += `
        <div class="ps">
          <div class="ps-label">Named prospect buildings</div>
          <div class="dev-item">${devText}</div>
        </div>`;
    }

    /* 6. Search intelligence */
    html += `
      <div class="ps">
        <div class="ps-label">Search intelligence</div>
        <div class="ps-label" style="border:none;padding:0;margin-bottom:4px;font-size:10px;color:var(--text-muted)">Content gap</div>
        ${r.content_gap
          ? `<div class="gap-box">${r.content_gap}</div>`
          : `<div class="gap-box">${noData('Not yet captured')}</div>`}
        <div class="ps-label" style="border:none;padding:0;margin:8px 0 6px;font-size:10px;color:var(--text-muted)">Keywords found</div>
        ${r.top_keywords_found && r.top_keywords_found.length
          ? `<div class="kw-list">${r.top_keywords_found.map(k => `<span class="kw-pill">${k}</span>`).join('')}</div>`
          : noData('No keywords captured yet')}
      </div>`;

    /* 7. Research intelligence (parsed from .md file) */
    const intelId = `intel-${c.city_slug}`;
    html += `
      <div class="ps">
        <div class="ps-label">Research intelligence</div>
        <div id="${intelId}" class="intel-loading">Loading findings…</div>
      </div>`;

    /* 8. Run confidence */
    if (r.run_confidence) {
      const conf = r.run_confidence.toLowerCase();
      const confCls = /^high/.test(conf) ? 'conf-high' : /^medium/.test(conf) ? 'conf-medium' : 'conf-low';
      html += `
        <div class="ps">
          <div class="ps-label">Run confidence</div>
          <div class="conf-box ${confCls}">${r.run_confidence}</div>
        </div>`;
    }

    /* 9. Research history */
    html += `
      <div class="ps">
        <div class="ps-label">Research history</div>
        <div class="history-row"><span>Last research run</span><span>${fmt(r.last_run_date)}</span></div>
        ${s.page_built ? `<div class="history-row" style="margin-top:5px"><span>SEO page built</span><span>${fmt(s.last_built_date)}</span></div>` : ''}
        <div style="margin-top:8px">
          ${r.file_path
            ? `<a href="${r.file_path}" target="_blank" style="color:var(--accent);font-size:12px;text-decoration:none">Open raw research file →</a>`
            : noData('No research file on record')}
        </div>
      </div>`;

    body.innerHTML = html;
    loadResearchIntel(intelId, r.file_path);
  }

  /* ═══════════════════════════════
     RESEARCH INTEL PARSER
  ═══════════════════════════════ */
  function parseTier1Block(block) {
    const lines = block.trim().split('\n');
    if (!lines.length) return null;
    let source = '';
    const srcMatch = lines[0].match(/^\*\*(.+?)\*\*/);
    if (srcMatch) source = srcMatch[1];
    let opportunity = '', url = '';
    const textLines = [];
    for (const line of lines.slice(1)) {
      const t = line.trim();
      if (/^Opportunity:/i.test(t)) { opportunity = t.replace(/^Opportunity:\s*/i, ''); }
      else if (/^https?:\/\//i.test(t)) { if (!url) url = t; }
      else if (t) { textLines.push(t); }
    }
    if (!source && !textLines.length) return null;
    return { source, text: textLines.join(' '), opportunity, url };
  }
  function parseTier0Block(block) {
    const lines = block.trim().split('\n');
    if (!lines.length) return null;
    let source = '';
    const srcMatch = lines[0].match(/^\*\*(?:Source:|Source\s·)\*\*\s*(.+)/) || lines[0].match(/^\*\*(.+?)\*\*/);
    if (srcMatch) source = srcMatch[1];
    let contentAngle = '', url = '';
    const textLines = [];
    for (const line of lines.slice(1)) {
      const t = line.trim();
      if (/^Content angle:/i.test(t)) { contentAngle = t.replace(/^Content angle:\s*/i, ''); }
      else if (/^https?:\/\//i.test(t)) { if (!url) url = t; }
      else if (t) { textLines.push(t); }
    }
    if (!source && !textLines.length) return null;
    return { source, text: textLines.join(' '), opportunity: contentAngle, url };
  }
  function parseTier2Line(line) {
    const raw = line.trim().replace(/^-\s*/, '');
    const srcMatch = raw.match(/^\*\*(.+?)\*\*/);
    const source = srcMatch ? srcMatch[1] : '';
    const text = raw.replace(/^\*\*.+?\*\*\s*(?:—\s*)?/, '');
    return { source, text };
  }
  function parseCompetitorBlock(block) {
    const lines = block.trim().split('\n');
    if (!lines.length) return null;
    const nameMatch = lines[0].match(/^\*\*(.+?)\*\*/);
    if (!nameMatch) return null;
    const name = nameMatch[1];
    let doing = '', theirAngle = '', counter = '', watchLevel = '';
    const descLines = [];
    for (const line of lines.slice(1)) {
      const t = line.trim().replace(/^-\s*/, '');
      if (/^What they.re doing:/i.test(t))  doing = t.replace(/^What they.re doing:\s*/i, '');
      else if (/^Their language:/i.test(t)) {}
      else if (/^Their angle vs/i.test(t))  theirAngle = t.replace(/^Their angle vs\. SpotShare:\s*/i, '');
      else if (/^SpotShare.s counter:/i.test(t)) counter = t.replace(/^SpotShare.s counter:\s*/i, '');
      else if (/^Watch level:/i.test(t))    watchLevel = t.replace(/^Watch level:\s*/i, '');
      else if (t) descLines.push(t);
    }
    return { name, description: doing || descLines.join(' '), their_angle: theirAngle, spotshare_counter: counter, watch_level: watchLevel };
  }
  function parseResearchMd(mdText) {
    const tiers = { tier0: [], tier1: [], tier2: [], competitors: [] };
    const sections = mdText.split(/\n(?=## )/);
    for (const section of sections) {
      const heading = (section.match(/^## (.+)/) || [])[1] || '';
      if (/TIER 1|ACT ON THESE/i.test(heading)) {
        const body = section.replace(/^## .+\n/, '');
        const blocks = body.split(/\n---\n/);
        for (const b of blocks) { const f = parseTier1Block(b); if (f) tiers.tier1.push(f); }
      } else if (/EDUCATION|CONTENT ANGLE/i.test(heading)) {
        const body = section.replace(/^## .+\n/, '');
        const blocks = body.split(/\n---\n/);
        for (const b of blocks) { const f = parseTier0Block(b); if (f) tiers.tier0.push(f); }
      } else if (/ALSO ON OUR RADAR/i.test(heading)) {
        const lines = section.split('\n');
        for (const line of lines) {
          if (/^- /.test(line.trim())) tiers.tier2.push(parseTier2Line(line));
        }
      } else if (/COMPETITOR INTELLIGENCE/i.test(heading)) {
        const body = section.replace(/^## .+\n/, '');
        const blocks = body.split(/\n---\n/);
        for (const b of blocks) { const f = parseCompetitorBlock(b); if (f) tiers.competitors.push(f); }
      }
    }
    return tiers;
  }
  function renderFinding(f, showOpp) {
    const opp = showOpp && f.opportunity
      ? `<div class="intel-opp">${showOpp === 'angle' ? 'Content angle: ' : 'Opportunity: '}${f.opportunity}</div>` : '';
    const link = f.url
      ? `<a class="intel-link" href="${f.url}" target="_blank" rel="noopener">${f.url}</a>` : '';
    return `
      <div class="intel-find">
        ${f.source ? `<div class="intel-src">${f.source}</div>` : ''}
        <div class="intel-txt">${f.text}</div>
        ${opp}${link}
      </div>`;
  }
  function renderIntelTabs(tiers) {
    const hasCompetitors = tiers.competitors && tiers.competitors.length > 0;
    const tabs = [
      { id: 'tier1', label: 'Tier 1',      findings: tiers.tier1,       showOpp: true },
      { id: 'tier0', label: 'Content angles', findings: tiers.tier0,    showOpp: 'angle' },
      { id: 'tier2', label: 'On radar',    findings: tiers.tier2,        showOpp: false },
    ];
    if (hasCompetitors) {
      tabs.splice(1, 0, { id: 'comp', label: 'Competitors', findings: tiers.competitors, showOpp: false, isComp: true });
    }
    const tabsHtml = tabs.map((t, i) => {
      const cnt = t.findings.length
        ? `<span class="tab-count">${t.findings.length}</span>` : '';
      return `<button class="intel-tab${i === 0 ? ' active' : ''}" data-tab="${t.id}">${t.label}${cnt}</button>`;
    }).join('');
    const panesHtml = tabs.map((t, i) => {
      let content;
      if (t.isComp) {
        content = t.findings.length ? t.findings.map(f => {
          const angles = (f.their_angle || f.spotshare_counter) ? `
            <div class="comp-angles" style="margin-top:8px">
              ${f.their_angle ? `<div class="comp-angle their"><div class="comp-angle-label">Their angle</div><div class="comp-angle-text">${f.their_angle}</div></div>` : ''}
              ${f.spotshare_counter ? `<div class="comp-angle ours"><div class="comp-angle-label">SpotShare counter</div><div class="comp-angle-text">${f.spotshare_counter}</div></div>` : ''}
            </div>` : '';
          return `<div class="comp-item"><div class="comp-header"><span class="comp-name">${f.name}</span>${f.watch_level ? `<span class="comp-tier tw">${f.watch_level}</span>` : ''}</div><div class="comp-desc">${f.description}</div>${angles}</div>`;
        }).join('') : `<div class="intel-empty">No competitor intelligence parsed this cycle</div>`;
      } else {
        content = t.findings.length
          ? t.findings.map(f => renderFinding(f, t.showOpp)).join('')
          : `<div class="intel-empty">No findings this cycle</div>`;
      }
      return `<div class="intel-pane" data-pane="${t.id}"${i !== 0 ? ' hidden' : ''}>${content}</div>`;
    }).join('');
    return `<div class="intel-tabs">${tabsHtml}</div>${panesHtml}`;
  }
  async function loadResearchIntel(containerId, filePath) {
    const container = document.getElementById(containerId);
    if (!container) return;
    if (!filePath) {
      container.innerHTML = `<div class="intel-empty">Run city research to populate this section</div>`;
      return;
    }
    try {
      const resp = await fetch(filePath);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();
      const tiers = parseResearchMd(text);
      container.innerHTML = renderIntelTabs(tiers);
      container.querySelectorAll('.intel-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const target = tab.dataset.tab;
          container.querySelectorAll('.intel-tab').forEach(t => t.classList.remove('active'));
          container.querySelectorAll('.intel-pane').forEach(p => p.hidden = true);
          tab.classList.add('active');
          container.querySelector(`.intel-pane[data-pane="${target}"]`).hidden = false;
        });
      });
    } catch(e) {
      container.innerHTML = `<div class="intel-empty">Could not load research file — ${e.message}</div>`;
    }
  }

} // end init()
</script>
